<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" font-family="Segoe UI, Roboto, -apple-system, sans-serif">
  <style>
    .top-label { fill: #475569; }
    .title     { fill: #0f172a; }
    .subtitle  { fill: #64748b; }
    .spec      { fill: #4f46e5; }
    .tagline   { fill: #64748b; }

    @media (prefers-color-scheme: dark) {
      .top-label { fill: #8b949e; }
      .title     { fill: #e6edf3; }
      .subtitle  { fill: #6e7681; }
      .spec      { fill: #818cf8; }
      .tagline   { fill: #8b949e; }
    }
  </style>

  <!-- Small top label -->
  <text x="600" y="105" text-anchor="middle" font-size="13" font-weight="700" letter-spacing="2" class="top-label">AZERBAIJANI LEGAL NLP · TEXT SEGMENTATION</text>

  <!-- Main title -->
  <text x="600" y="185" text-anchor="middle" font-size="58" font-weight="700" class="title">Sentence Boundary Detector</text>
  <text x="600" y="225" text-anchor="middle" font-size="17" class="subtitle">character-level classifier · 28 engineered features · random forest</text>

  <!-- Pipeline pills -->
  <!-- Pill 1: Features — indigo -->
  <rect x="226" y="290" width="170" height="120" rx="60" fill="#6366f1"/>
  <text x="311" y="358" text-anchor="middle" font-size="24" font-weight="700" fill="#ffffff">Features</text>

  <!-- Pill 2: Forest — purple -->
  <rect x="412" y="290" width="150" height="120" rx="60" fill="#a855f7"/>
  <text x="487" y="358" text-anchor="middle" font-size="24" font-weight="700" fill="#ffffff">Forest</text>

  <!-- Pill 3: Treelite — cyan -->
  <rect x="578" y="290" width="170" height="120" rx="60" fill="#06b6d4"/>
  <text x="663" y="358" text-anchor="middle" font-size="24" font-weight="700" fill="#ffffff">Treelite</text>

  <!-- Pill 4: Triton FIL — green -->
  <rect x="764" y="290" width="210" height="120" rx="60" fill="#10b981"/>
  <text x="869" y="358" text-anchor="middle" font-size="24" font-weight="700" fill="#ffffff">Triton FIL</text>

  <!-- Spec below -->
  <text x="600" y="490" text-anchor="middle" font-size="30" font-weight="600" font-style="italic" class="spec">76ms → 3ms · 25× faster</text>
  <text x="600" y="525" text-anchor="middle" font-size="14" class="tagline">0.958 F1 · FastAPI + Triton · Docker Compose</text>

</svg>
